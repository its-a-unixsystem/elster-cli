[package]
name = "kiecli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
directories = "6"
libloading = "0.8.9"
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
tempfile = "3"
toml = "0.9"
