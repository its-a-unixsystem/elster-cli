name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      test_system:
        description: Run the registered HerstellerID test instead of the reachability probe
        type: boolean
        default: false
  schedule:
    - cron: '20 6 * * 1'

permissions:
  contents: read

jobs:
  checks:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check DCO sign-offs
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$GITHUB_SHA"
            if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
              base=''
              if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
                base=$(git rev-parse --verify "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")
              fi
            fi
          fi
          if [[ -n "$base" ]] && ! git cat-file -e "$base^{commit}"; then
            git fetch --no-tags origin "$base"
          fi
          bash .github/scripts/check-dco.sh "$head" "$base"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          arguments: --locked

  eric-local:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-test-eric
        id: eric
      - name: Check the offline binding
        env:
          KIECLI_TEST_ERIC_HOME: ${{ steps.eric.outputs.home }}
        run: |
          cargo test --locked --test eric_status reports_the_loaded_library_version_offline -- --ignored --exact
          cargo test --locked --bin kiecli eric::ci::converts_a_bescheid_steuernummer_offline -- --ignored --exact
          cargo test --locked --bin kiecli eric::install::tests::extracts_only_linux_and_activates_after_a_real_test_load -- --ignored --exact
          cargo test --locked --bin kiecli eric::ci::validates_placeholder_hersteller_id_offline -- --ignored --exact
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          export KIECLI_TEST_CERTIFICATE="$tmp/test-softorg-pse.pfx"
          bash .github/scripts/download-test-certificate.sh "$KIECLI_TEST_CERTIFICATE"
          cargo test --locked --test certificate_status inspects_an_official_test_certificate_offline -- --ignored --exact
          cargo test --locked --test postfach_status rejects_a_test_certificate_in_live_mode -- --ignored --exact
      - name: Validate the invented Postfach response fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxml2-utils
          bash .github/scripts/check-postfach-fixture.sh

  # Remove this job once a hosted runner has received the expected ELSTER reply.
  elster-reachability:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.test_system }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-test-eric
        id: eric
      - name: Send the read-only test-system probe
        shell: bash
        env:
          KIECLI_TEST_ERIC_HOME: ${{ steps.eric.outputs.home }}
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          export KIECLI_TEST_CERTIFICATE="$tmp/test-softorg-pse.pfx"
          bash .github/scripts/download-test-certificate.sh "$KIECLI_TEST_CERTIFICATE"
          KIECLI_TEST_POSTFACH_SINCE=$(date -u -d yesterday +%Y%m%d)
          export KIECLI_TEST_POSTFACH_SINCE
          cargo test --locked --bin kiecli eric::ci::elster_test_system_is_reachable -- --ignored --exact

  test-system:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.test_system)) }}
    environment: ${{ github.event_name == 'schedule' && 'elster-test-scheduled' || 'elster-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-test-eric
        id: eric
      - run: cargo build --locked
      - name: Exercise the Postfach lifecycle on the ELSTER test system
        shell: bash
        env:
          KIECLI_ERIC_DIR: ${{ steps.eric.outputs.home }}
          KIECLI_HERSTELLER_ID: ${{ secrets.KIECLI_HERSTELLER_ID }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          [[ "$KIECLI_HERSTELLER_ID" =~ ^[0-9]{5}$ ]] || {
            echo 'The ELSTER test environment requires a five-digit HerstellerID secret.' >&2
            exit 1
          }
          export KIECLI_CERTIFICATE="$tmp/test-softorg-pse.pfx"
          export KIECLI_PIN=123456
          bash .github/scripts/download-test-certificate.sh "$KIECLI_CERTIFICATE"
          target/debug/kiecli zertifikat status --test > "$tmp/certificate.json"
          # Keep the HerstellerID and certificate CN out of logs, including on a match.
          jq -er 'select(.testzertifikat == true) | .konto_id | select(type == "string" and length > 0)' \
            "$tmp/certificate.json" > "$tmp/patterns"
          printf '%s\n' "$KIECLI_HERSTELLER_ID" >> "$tmp/patterns"
          if git grep --cached -qF -f "$tmp/patterns"; then
            echo 'Tracked files contain a credential identifier.' >&2
            exit 1
          else
            [[ $? == 1 ]] || exit 1
          fi
          since=$(date -u -d yesterday +%F)
          target/debug/kiecli postfach status --test --alle --von "$since" \
            > "$tmp/status.json" 2> "$tmp/status-error.json" || {
              echo 'Postfach status failed on the ELSTER test system.' >&2
              exit 1
            }
          jq -e '.test == true and .einschraenkung == "alle" and
            (.bereitstellungsdatenarten | type == "array" and
              all(.[]; (.name | type == "string") and (.anzahl | type == "number")))' \
            "$tmp/status.json" > /dev/null
          target/debug/kiecli postfach anfrage --test --alle --von "$since" \
            > "$tmp/anfrage.json" 2> "$tmp/anfrage-error.json" || {
              echo 'Postfach Anfrage failed on the ELSTER test system.' >&2
              exit 1
            }
          jq -e '.test == true and
            (.postfach_nachrichten | type == "array" and
              all(.[]; (.id | type == "string") and (.bereitstellungsdatenart | type == "string")) and
              (map(.id) == (map(.id) | sort)))' \
            "$tmp/anfrage.json" > /dev/null
          target/debug/kiecli postfach anfrage --test --neue --von "$since" \
            > "$tmp/neue.json" 2> "$tmp/neue-error.json" || {
              echo 'Postfach Anfrage for unconfirmed Nachrichten failed.' >&2
              exit 1
            }
          # Never collect or confirm an unconfirmed Nachricht in the shared test Postfach.
          id=$(jq -er --slurpfile neue "$tmp/neue.json" '
            ($neue[0].postfach_nachrichten | map({key: .id, value: true}) | from_entries) as $unconfirmed |
            first(.postfach_nachrichten[] |
              select(($unconfirmed[.id] | not) and (.datenpaket != null or (.anhaenge | length > 0))) |
              .id)
          ' "$tmp/anfrage.json") || {
            echo 'No already confirmed Nachricht with files found in the shared test Postfach.' >&2
            exit 1
          }
          target/debug/kiecli postfach abholung --test --id "$id" --von "$since" \
            --out "$tmp/files" --bestaetigen > "$tmp/abholung.json" 2> "$tmp/abholung-error.json" || {
              echo 'Postfach Abholung or its Bestätigung failed on the ELSTER test system.' >&2
              exit 1
            }
          jq -e --arg id "$id" '.test and
            (.postfach_nachrichten | length == 1 and
             .[0].id == $id and .[0].status == "vollstaendig" and
             .[0].bestaetigt and (.[0].files | length > 0))' "$tmp/abholung.json" > /dev/null
          target/debug/kiecli postfach bestaetigung --test --id "$id" \
            > "$tmp/bestaetigung.json" 2> "$tmp/bestaetigung-error.json" || {
              echo 'Standalone Postfach Bestätigung failed on the ELSTER test system.' >&2
              exit 1
            }
          jq -e --arg id "$id" '.test and
            (.postfach_nachrichten | length == 1 and
             .[0].id == $id and .[0].bestaetigt and .[0].rueckgabe.code == 0)' \
            "$tmp/bestaetigung.json" > /dev/null
          run_kontoabfrage() {
            local name=$1
            shift
            local stdout="$tmp/kontoabfrage-${name}.stdout"
            local stderr="$tmp/kontoabfrage-${name}.stderr"
            set +e
            target/debug/kiecli "$@" >"$stdout" 2>"$stderr"
            local status=$?
            set -e
            [[ "$status" == 5 && ! -s "$stdout" ]] || {
              echo "Kontoabfrage ${name} did not return the expected authorization result." >&2
              exit 1
            }
            jq -e '(.error.cause | any(.code == 230077012))' "$stderr" >/dev/null || {
              echo "Kontoabfrage ${name} returned an unexpected structured error." >&2
              exit 1
            }
          }
          # 9238 is the documented test Finanzamt; response data stays in mode-077 files.
          run_kontoabfrage offene kontoabfrage offene-betraege --test --steuernummer 9238020010101
          run_kontoabfrage zahlungen kontoabfrage zahlungen --test --steuernummer 9238020010101 --ab 2026-01-02
          run_kontoabfrage sollstellungen kontoabfrage sollstellungen --test --steuernummer 9238020010101 --steuerart ESt --jahr 2025
